<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div id="container">
    <div id="display-bar">
      <p id="result">0</p>
    </div>

    <div id="calc-body">
      <table>
        <tr>
          <td class="left">
            <table id="calc-numbers">
              <tr>
                <td class="number">9</td>
                <td class="number">8</td>
                <td class="number">7</td>
              </tr>
              <tr>
                <td class="number">6</td>
                <td class="number">5</td>
                <td class="number">4</td>            
              </tr>
              <tr>
                <td class="number">3</td>
                <td class="number">2</td>
                <td class="number">1</td>            
              </tr>
              <tr>
                <td class="number" colspan="3">0</td>
              </tr>       
            </table>
          </td>
          <td class="right">
            <table id="calc-operators">
              <tr>
                <td class="operator">+</td>
              </tr>
              <tr>
                <td class="operator">-</td>
              </tr>
              <tr>
                <td class="operator">*</td>
              </tr>
              <tr>
                <td class="operator">/</td>
              </tr>
            </table>
          </td>
        </tr>   
        <tr>
          <table>
            <tr>
              <td class="left" id="clear">CLEAR</td>
              <td class="right" id="equals">=</td>
            </tr>
          </table>
        </tr>                 
      </table>
    </div>
  </div>
</body>
</html>
